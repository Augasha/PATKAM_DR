{% extends "base.html" %}

{% block title %}Drivers - Transport Database System{% endblock %}

{% block content %}
<div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
    <h1 class="h2">Drivers Management</h1>
    <div class="btn-toolbar mb-2 mb-md-0">
        <div class="btn-group me-2">
            <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#driverModal" onclick="openDriverModal()">
                <i class="bi bi-plus-circle"></i> Add Driver
            </button>
        </div>
    </div>
</div>

<!-- Drivers Table -->
<div class="card">
    <div class="card-body">
        <div class="table-responsive">
            <table class="table table-striped table-hover">
                <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>License Number</th>
                        <th>Phone</th>
                        <th>Email</th>
                        <th>Status</th>
                        <th>License Expiry</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="drivers-table">
                    <tr>
                        <td colspan="8" class="text-center">Loading drivers...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- Driver Modal -->
<div class="modal fade" id="driverModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="driverModalTitle">Add Driver</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="driverForm">
                    <input type="hidden" id="driverId">
                    
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="firstName" class="form-label">First Name *</label>
                            <input type="text" class="form-control" id="firstName" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="lastName" class="form-label">Last Name *</label>
                            <input type="text" class="form-control" id="lastName" required>
                        </div>
                    </div>
                    
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="licenseNumber" class="form-label">License Number *</label>
                            <input type="text" class="form-control" id="licenseNumber" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="phone" class="form-label">Phone</label>
                            <input type="tel" class="form-control" id="phone">
                        </div>
                    </div>
                    
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="email" class="form-label">Email</label>
                            <input type="email" class="form-control" id="email">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="status" class="form-label">Status</label>
                            <select class="form-select" id="status">
                                <option value="active">Active</option>
                                <option value="inactive">Inactive</option>
                                <option value="suspended">Suspended</option>
                            </select>
                        </div>
                    </div>
                    
                    <div class="mb-3">
                        <label for="address" class="form-label">Address</label>
                        <textarea class="form-control" id="address" rows="2"></textarea>
                    </div>
                    
                    <div class="row">
                        <div class="col-md-4 mb-3">
                            <label for="dateOfBirth" class="form-label">Date of Birth</label>
                            <input type="date" class="form-control" id="dateOfBirth">
                        </div>
                        <div class="col-md-4 mb-3">
                            <label for="hireDate" class="form-label">Hire Date</label>
                            <input type="date" class="form-control" id="hireDate">
                        </div>
                        <div class="col-md-4 mb-3">
                            <label for="licenseExpiry" class="form-label">License Expiry</label>
                            <input type="date" class="form-control" id="licenseExpiry">
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-primary" onclick="saveDriver()">Save Driver</button>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    let currentDriverId = null;

    async function loadDrivers() {
        try {
            const response = await fetch('/api/drivers');
            const drivers = await response.json();
            
            const table = document.getElementById('drivers-table');
            if (drivers.length === 0) {
                table.innerHTML = '<tr><td colspan="8" class="text-center">No drivers found</td></tr>';
            } else {
                table.innerHTML = drivers.map(driver => `
                    <tr>
                        <td>${driver.id}</td>
                        <td>${driver.first_name} ${driver.last_name}</td>
                        <td>${driver.license_number}</td>
                        <td>${driver.phone || 'N/A'}</td>
                        <td>${driver.email || 'N/A'}</td>
                        <td><span class="badge bg-${getStatusColor(driver.status)}">${driver.status}</span></td>
                        <td>${formatDate(driver.license_expiry)}</td>
                        <td class="table-actions">
                            <button class="btn btn-sm btn-outline-primary" onclick="editDriver(${driver.id})">
                                <i class="bi bi-pencil"></i>
                            </button>
                            <button class="btn btn-sm btn-outline-danger" onclick="deleteDriver(${driver.id})">
                                <i class="bi bi-trash"></i>
                            </button>
                        </td>
                    </tr>
                `).join('');
            }
        } catch (error) {
            console.error('Error loading drivers:', error);
            showAlert('Error loading drivers', 'error');
        }
    }

    function openDriverModal() {
        currentDriverId = null;
        document.getElementById('driverModalTitle').textContent = 'Add Driver';
        document.getElementById('driverForm').reset();
        document.getElementById('driverId').value = '';
    }

    async function editDriver(driverId) {
        try {
            const response = await fetch(`/api/drivers/${driverId}`);
            const driver = await response.json();
            
            currentDriverId = driverId;
            document.getElementById('driverModalTitle').textContent = 'Edit Driver';
            document.getElementById('driverId').value = driver.id;
            document.getElementById('firstName').value = driver.first_name;
            document.getElementById('lastName').value = driver.last_name;
            document.getElementById('licenseNumber').value = driver.license_number;
            document.getElementById('phone').value = driver.phone || '';
            document.getElementById('email').value = driver.email || '';
            document.getElementById('status').value = driver.status;
            document.getElementById('address').value = driver.address || '';
            document.getElementById('dateOfBirth').value = driver.date_of_birth || '';
            document.getElementById('hireDate').value = driver.hire_date || '';
            document.getElementById('licenseExpiry').value = driver.license_expiry || '';
            
            const modal = new bootstrap.Modal(document.getElementById('driverModal'));
            modal.show();
        } catch (error) {
            console.error('Error loading driver:', error);
            showAlert('Error loading driver', 'error');
        }
    }

    async function saveDriver() {
        const form = document.getElementById('driverForm');
        if (!form.checkValidity()) {
            form.reportValidity();
            return;
        }

        const driverData = {
            first_name: document.getElementById('firstName').value,
            last_name: document.getElementById('lastName').value,
            license_number: document.getElementById('licenseNumber').value,
            phone: document.getElementById('phone').value,
            email: document.getElementById('email').value,
            status: document.getElementById('status').value,
            address: document.getElementById('address').value,
            date_of_birth: document.getElementById('dateOfBirth').value,
            hire_date: document.getElementById('hireDate').value,
            license_expiry: document.getElementById('licenseExpiry').value
        };

        try {
            const url = currentDriverId ? `/api/drivers/${currentDriverId}` : '/api/drivers';
            const method = currentDriverId ? 'PUT' : 'POST';
            
            const response = await fetch(url, {
                method: method,
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(driverData)
            });

            if (response.ok) {
                showAlert(currentDriverId ? 'Driver updated successfully' : 'Driver created successfully');
                bootstrap.Modal.getInstance(document.getElementById('driverModal')).hide();
                loadDrivers();
            } else {
                const error = await response.json();
                showAlert(error.error || 'Error saving driver', 'error');
            }
        } catch (error) {
            console.error('Error saving driver:', error);
            showAlert('Error saving driver', 'error');
        }
    }

    async function deleteDriver(driverId) {
        confirmDelete(async () => {
            try {
                const response = await fetch(`/api/drivers/${driverId}`, {
                    method: 'DELETE'
                });

                if (response.ok) {
                    showAlert('Driver deleted successfully');
                    loadDrivers();
                } else {
                    const error = await response.json();
                    showAlert(error.error || 'Error deleting driver', 'error');
                }
            } catch (error) {
                console.error('Error deleting driver:', error);
                showAlert('Error deleting driver', 'error');
            }
        });
    }

    function getStatusColor(status) {
        switch(status) {
            case 'active': return 'success';
            case 'inactive': return 'secondary';
            case 'suspended': return 'danger';
            default: return 'secondary';
        }
    }

    // Load drivers on page load
    document.addEventListener('DOMContentLoaded', loadDrivers);
</script>
{% endblock %}
