{% extends "base.html" %}

{% block title %}Trips - Transport Database System{% endblock %}

{% block content %}
<div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
    <h1 class="h2">Trips Management</h1>
    <div class="btn-toolbar mb-2 mb-md-0">
        <div class="btn-group me-2">
            <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#tripModal" onclick="openTripModal()">
                <i class="bi bi-plus-circle"></i> Add Trip
            </button>
        </div>
    </div>
</div>

<!-- Trips Table -->
<div class="card">
    <div class="card-body">
        <div class="table-responsive">
            <table class="table table-striped table-hover">
                <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Date</th>
                        <th>Driver</th>
                        <th>Vehicle</th>
                        <th>Route</th>
                        <th>Status</th>
                        <th>Distance</th>
                        <th>Fuel</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="trips-table">
                    <tr>
                        <td colspan="9" class="text-center">Loading trips...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- Trip Modal -->
<div class="modal fade" id="tripModal" tabindex="-1">
    <div class="modal-dialog modal-xl">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="tripModalTitle">Add Trip</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="tripForm">
                    <input type="hidden" id="tripId">
                    
                    <div class="row">
                        <div class="col-md-3 mb-3">
                            <label for="tripDate" class="form-label">Trip Date *</label>
                            <input type="date" class="form-control" id="tripDate" required>
                        </div>
                        <div class="col-md-3 mb-3">
                            <label for="driverId" class="form-label">Driver *</label>
                            <select class="form-select" id="driverId" required>
                                <option value="">Select Driver</option>
                            </select>
                        </div>
                        <div class="col-md-3 mb-3">
                            <label for="vehicleId" class="form-label">Vehicle *</label>
                            <select class="form-select" id="vehicleId" required>
                                <option value="">Select Vehicle</option>
                            </select>
                        </div>
                        <div class="col-md-3 mb-3">
                            <label for="routeId" class="form-label">Route</label>
                            <select class="form-select" id="routeId">
                                <option value="">Select Route</option>
                            </select>
                        </div>
                    </div>
                    
                    <div class="row">
                        <div class="col-md-3 mb-3">
                            <label for="startTime" class="form-label">Start Time</label>
                            <input type="time" class="form-control" id="startTime">
                        </div>
                        <div class="col-md-3 mb-3">
                            <label for="endTime" class="form-label">End Time</label>
                            <input type="time" class="form-control" id="endTime">
                        </div>
                        <div class="col-md-3 mb-3">
                            <label for="status" class="form-label">Status</label>
                            <select class="form-select" id="status">
                                <option value="scheduled">Scheduled</option>
                                <option value="in_progress">In Progress</option>
                                <option value="completed">Completed</option>
                                <option value="cancelled">Cancelled</option>
                            </select>
                        </div>
                        <div class="col-md-3 mb-3">
                            <label for="purpose" class="form-label">Purpose</label>
                            <input type="text" class="form-control" id="purpose">
                        </div>
                    </div>
                    
                    <div class="row">
                        <div class="col-md-3 mb-3">
                            <label for="startMileage" class="form-label">Start Mileage</label>
                            <input type="number" class="form-control" id="startMileage" min="0">
                        </div>
                        <div class="col-md-3 mb-3">
                            <label for="endMileage" class="form-label">End Mileage</label>
                            <input type="number" class="form-control" id="endMileage" min="0">
                        </div>
                        <div class="col-md-3 mb-3">
                            <label for="distanceCovered" class="form-label">Distance (km)</label>
                            <input type="number" class="form-control" id="distanceCovered" min="0" step="0.1">
                        </div>
                        <div class="col-md-3 mb-3">
                            <label for="fuelConsumed" class="form-label">Fuel Consumed (L)</label>
                            <input type="number" class="form-control" id="fuelConsumed" min="0" step="0.1">
                        </div>
                    </div>
                    
                    <div class="row">
                        <div class="col-md-3 mb-3">
                            <label for="passengerCount" class="form-label">Passenger Count</label>
                            <input type="number" class="form-control" id="passengerCount" min="0">
                        </div>
                        <div class="col-md-3 mb-3">
                            <label for="cargoWeight" class="form-label">Cargo Weight (kg)</label>
                            <input type="number" class="form-control" id="cargoWeight" min="0" step="0.1">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="notes" class="form-label">Notes</label>
                            <textarea class="form-control" id="notes" rows="1"></textarea>
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-primary" onclick="saveTrip()">Save Trip</button>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    let currentTripId = null;
    let drivers = [];
    let vehicles = [];
    let routes = [];

    async function loadTrips() {
        try {
            const response = await fetch('/api/trips');
            const trips = await response.json();
            
            const table = document.getElementById('trips-table');
            if (trips.length === 0) {
                table.innerHTML = '<tr><td colspan="9" class="text-center">No trips found</td></tr>';
            } else {
                table.innerHTML = trips.map(trip => `
                    <tr>
                        <td>${trip.id}</td>
                        <td>${formatDate(trip.trip_date)}</td>
                        <td>${trip.driver_name || 'N/A'}</td>
                        <td>${trip.vehicle_name || 'N/A'}<br><small>${trip.license_plate}</small></td>
                        <td>${trip.route_name || 'N/A'}</td>
                        <td><span class="badge bg-${getStatusColor(trip.status)}">${trip.status}</span></td>
                        <td>${trip.distance_covered || 'N/A'} km</td>
                        <td>${trip.fuel_consumed || 'N/A'} L</td>
                        <td class="table-actions">
                            <button class="btn btn-sm btn-outline-primary" onclick="editTrip(${trip.id})">
                                <i class="bi bi-pencil"></i>
                            </button>
                            <button class="btn btn-sm btn-outline-danger" onclick="deleteTrip(${trip.id})">
                                <i class="bi bi-trash"></i>
                            </button>
                        </td>
                    </tr>
                `).join('');
            }
        } catch (error) {
            console.error('Error loading trips:', error);
            showAlert('Error loading trips', 'error');
        }
    }

    async function loadDropdownData() {
        try {
            // Load drivers
            const driversResponse = await fetch('/api/drivers');
            drivers = await driversResponse.json();
            const driverSelect = document.getElementById('driverId');
            driverSelect.innerHTML = '<option value="">Select Driver</option>' +
                drivers.filter(d => d.status === 'active').map(driver => 
                    `<option value="${driver.id}">${driver.first_name} ${driver.last_name}</option>`
                ).join('');

            // Load vehicles
            const vehiclesResponse = await fetch('/api/vehicles');
            vehicles = await vehiclesResponse.json();
            const vehicleSelect = document.getElementById('vehicleId');
            vehicleSelect.innerHTML = '<option value="">Select Vehicle</option>' +
                vehicles.filter(v => v.status === 'active').map(vehicle => 
                    `<option value="${vehicle.id}">${vehicle.year} ${vehicle.make} ${vehicle.model} (${vehicle.license_plate})</option>`
                ).join('');

            // Load routes
            const routesResponse = await fetch('/api/routes');
            routes = await routesResponse.json();
            const routeSelect = document.getElementById('routeId');
            routeSelect.innerHTML = '<option value="">Select Route</option>' +
                routes.map(route => 
                    `<option value="${route.id}">${route.route_name}</option>`
                ).join('');

        } catch (error) {
            console.error('Error loading dropdown data:', error);
        }
    }

    function openTripModal() {
        currentTripId = null;
        document.getElementById('tripModalTitle').textContent = 'Add Trip';
        document.getElementById('tripForm').reset();
        document.getElementById('tripId').value = '';
        loadDropdownData();
    }

    async function editTrip(tripId) {
        try {
            const response = await fetch(`/api/trips/${tripId}`);
            const trip = await response.json();
            
            await loadDropdownData();
            
            currentTripId = tripId;
            document.getElementById('tripModalTitle').textContent = 'Edit Trip';
            document.getElementById('tripId').value = trip.id;
            document.getElementById('tripDate').value = trip.trip_date;
            document.getElementById('driverId').value = trip.driver_id;
            document.getElementById('vehicleId').value = trip.vehicle_id;
            document.getElementById('routeId').value = trip.route_id || '';
            document.getElementById('startTime').value = trip.start_time || '';
            document.getElementById('endTime').value = trip.end_time || '';
            document.getElementById('status').value = trip.status;
            document.getElementById('purpose').value = trip.purpose || '';
            document.getElementById('startMileage').value = trip.start_mileage || '';
            document.getElementById('endMileage').value = trip.end_mileage || '';
            document.getElementById('distanceCovered').value = trip.distance_covered || '';
            document.getElementById('fuelConsumed').value = trip.fuel_consumed || '';
            document.getElementById('passengerCount').value = trip.passenger_count || '';
            document.getElementById('cargoWeight').value = trip.cargo_weight || '';
            document.getElementById('notes').value = trip.notes || '';
            
            const modal = new bootstrap.Modal(document.getElementById('tripModal'));
            modal.show();
        } catch (error) {
            console.error('Error loading trip:', error);
            showAlert('Error loading trip', 'error');
        }
    }

    async function saveTrip() {
        const form = document.getElementById('tripForm');
        if (!form.checkValidity()) {
            form.reportValidity();
            return;
        }

        const tripData = {
            driver_id: parseInt(document.getElementById('driverId').value),
            vehicle_id: parseInt(document.getElementById('vehicleId').value),
            route_id: document.getElementById('routeId').value ? parseInt(document.getElementById('routeId').value) : null,
            trip_date: document.getElementById('tripDate').value,
            start_time: document.getElementById('startTime').value,
            end_time: document.getElementById('endTime').value,
            status: document.getElementById('status').value,
            purpose: document.getElementById('purpose').value,
            start_mileage: document.getElementById('startMileage').value ? parseInt(document.getElementById('startMileage').value) : null,
            end_mileage: document.getElementById('endMileage').value ? parseInt(document.getElementById('endMileage').value) : null,
            distance_covered: document.getElementById('distanceCovered').value ? parseFloat(document.getElementById('distanceCovered').value) : null,
            fuel_consumed: document.getElementById('fuelConsumed').value ? parseFloat(document.getElementById('fuelConsumed').value) : null,
            passenger_count: document.getElementById('passengerCount').value ? parseInt(document.getElementById('passengerCount').value) : 0,
            cargo_weight: document.getElementById('cargoWeight').value ? parseFloat(document.getElementById('cargoWeight').value) : null,
            notes: document.getElementById('notes').value
        };

        try {
            const url = currentTripId ? `/api/trips/${currentTripId}` : '/api/trips';
            const method = currentTripId ? 'PUT' : 'POST';
            
            const response = await fetch(url, {
                method: method,
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(tripData)
            });

            if (response.ok) {
                showAlert(currentTripId ? 'Trip updated successfully' : 'Trip created successfully');
                bootstrap.Modal.getInstance(document.getElementById('tripModal')).hide();
                loadTrips();
            } else {
                const error = await response.json();
                showAlert(error.error || 'Error saving trip', 'error');
            }
        } catch (error) {
            console.error('Error saving trip:', error);
            showAlert('Error saving trip', 'error');
        }
    }

    async function deleteTrip(tripId) {
        confirmDelete(async () => {
            try {
                const response = await fetch(`/api/trips/${tripId}`, {
                    method: 'DELETE'
                });

                if (response.ok) {
                    showAlert('Trip deleted successfully');
                    loadTrips();
                } else {
                    const error = await response.json();
                    showAlert(error.error || 'Error deleting trip', 'error');
                }
            } catch (error) {
                console.error('Error deleting trip:', error);
                showAlert('Error deleting trip', 'error');
            }
        });
    }

    function getStatusColor(status) {
        switch(status) {
            case 'completed': return 'success';
            case 'in_progress': return 'primary';
            case 'scheduled': return 'info';
            case 'cancelled': return 'danger';
            default: return 'secondary';
        }
    }

    // Load trips on page load
    document.addEventListener('DOMContentLoaded', loadTrips);
</script>
{% endblock %}
